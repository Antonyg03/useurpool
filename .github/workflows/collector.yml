name: Collector

# Samples Master+ Ranked Solo games (EUW + KR) into Supabase.
# Needs repository secrets: RIOT_API_KEY, SUPABASE_URL, SUPABASE_SECRET_KEY.
# Each run collects for ~5.5 hours and then starts the next run itself, so
# collection never pauses. The hourly schedule is only a backup in case the
# chain breaks (GitHub often skips scheduled runs).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget per region (minutes)"
        default: "330"

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        region: [euw1, kr]
    concurrency:
      group: collector-${{ matrix.region }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect ${{ matrix.region }}
        run: node collector/collect.mjs
        env:
          REGION: ${{ matrix.region }}
          MAX_MINUTES: ${{ github.event.inputs.minutes || '330' }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  next:
    # Start the next run right away (workflow_dispatch from GITHUB_TOKEN is allowed).
    needs: collect
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Start next collector run
        run: gh workflow run collector.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
